
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            color: #252525;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            min-width: 0;
        }

        input:focus {
            border-color: #6c63ff;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
        }

        .add-btn {
            background: #6c63ff;
            color: white;
            padding: 12px 18px;
        }

        .add-btn:hover {
            background: #554be0;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 10px;
            border-bottom: 1px solid #eee;
        }

        .task input {
            flex: none;
            width: 17px;
            height: 17px;
            cursor: pointer;
        }

        .task span {
            flex: 1;
            color: #333;
            overflow-wrap: anywhere;
        }

        .completed span {
            text-decoration: line-through;
            color: #aaa;
        }

        .delete-btn {
            background: #ffe8e8;
            color: #e44;
            padding: 7px 10px;
        }

        .delete-btn:hover {
            background: #ffd3d3;
        }

        .summary {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 13px;
            margin-top: 20px;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 25px 0;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Daily Tasks 📝</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <div class="input-area">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button class="add-btn" onclick="addTask()">
                Add
            </button>
        </div>

        <div id="taskList"></div>

        <div class="summary">
            <span id="totalTasks">Total: 0</span>
            <span id="completedTasks">Completed: 0</span>
        </div>

    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function addTask() {
            const input = document.getElementById("taskInput");
            const taskText = input.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            tasks.push({
                text: taskText,
                completed: false
            });

            input.value = "";

            saveTasks();
            displayTasks();
        }

        function displayTasks() {
            const taskList = document.getElementById("taskList");

            taskList.innerHTML = "";

            if (tasks.length === 0) {
                taskList.innerHTML =
                    '<p class="empty">No tasks yet. Add your first task!</p>';
            }

            tasks.forEach((task, index) => {
                const div = document.createElement("div");

                div.className = "task";

                if (task.completed) {
                    div.classList.add("completed");
                }

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;

                checkbox.addEventListener("change", () => {
                    tasks[index].completed = checkbox.checked;
                    saveTasks();
                    displayTasks();
                });

                const span = document.createElement("span");
                span.textContent = task.text;

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.className = "delete-btn";

                deleteBtn.addEventListener("click", () => {
                    tasks.splice(index, 1);
                    saveTasks();
                    displayTasks();
                });

                div.appendChild(checkbox);
                div.appendChild(span);
                div.appendChild(deleteBtn);

                taskList.appendChild(div);
            });

            document.getElementById("totalTasks").textContent =
                "Total: " + tasks.length;

            document.getElementById("completedTasks").textContent =
                "Completed: " +
                tasks.filter(task => task.completed).length;
        }

        document.getElementById("taskInput").addEventListener(
            "keypress",
            function(event) {
                if (event.key === "Enter") {
                    addTask();
                }
            }
        );

        displayTasks();
    </script>

</body>
</html>
